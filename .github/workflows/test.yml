name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest  # Apple silicon, matching pixi.toml's osx-arm64.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.55.0
          cache: true
          locked: true
      - name: Tests (runtime assertions on)
        run: pixi run test
      - name: Tests (default assertions)
        run: pixi run test-release
